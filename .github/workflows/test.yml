name: ViralPick API validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for f in api/*.js lib/*.js account-ui.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test tests/*.test.js
